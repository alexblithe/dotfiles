version = 1

; (Optional) This section provides global settings shared across all presets.
; If the same key is defined in a specific preset, it will override the value in this global section.

sleep-idle-seconds=300

[Qwen3-Coder-Next]
n-gpu-layers=9999
dev = Vulkan1
ub=1024
b=1024
cache-reuse=1024
alias=Qwen3-Coder-Next
jinja=true
fit=on
fa=on
cache-type-k=q8_0
cache-type-v=q8_0
alias=Qwen3-Coder-Next

[unsloth/gpt-oss-120b-GGUF:Q4_K_M]
n-gpu-layers=9999
dev=Vulkan1
mmap=false
cache-type-k=q8_0
cache-type-v=q8_0
alias=gpt-oss-120b

[Qwen3.8-27B]
n-gpu-layers=9999
dev=CUDA0
load-mode=none
no-mmproj=true
model=/var/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
alias=Qwen3.8-27B
; cache-type-k=q8_0
; cache-type-v=q8_0
cache-reuse=1024
temperature=1.0
top-p=0.95
top-k=20
min-p=0.0
spec-default=true
spec-type=draft-mtp,ngram-mod
spec-draft-n-max=3
spec-draft-type-k=q8_0
spec-draft-type-v=q8_0
spec-ngram-mod-n-match=24
spec-ngram-mod-n-max=64
spec-ngram-mod-n-min=48
kv-unified=true
reasoning-preserve=true
chat-template-kwargs={"preserve_thinking":true}

[Qwen4-flash]
n-gpu-layers=9999
dev=CUDA0,Vulkan1
load-mode=none
no-mmproj=true
tensor-read-lazy=on
model=/var/models/qwen-4-next-flash/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
alias=Qwen4-flash
; cache-type-k=q8_0
; cache-type-v=q8_0
cache-reuse=1024
temperature=1.0
top-p=0.95
top-k=20
min-p=0.0
spec-default=true
spec-type=ngram-mod
ot=".*ffn_.*_exps\.=Vulkan1"
; spec-draft-n-max=3
; spec-draft-type-k=q8_0
; spec-draft-type-v=q8_0
spec-ngram-mod-n-match=24
spec-ngram-mod-n-max=64
spec-ngram-mod-n-min=48
kv-unified=true
reasoning-preserve=true
chat-template-kwargs={"preserve_thinking":true}



[Ornith-1.5-35B-A3B-Q8_0.gguf]
n-gpu-layers=9999
model=/var/models/Ornith-1.5-35B-A3B-Q8_0.gguf
dev=VULKAN1
mmap=false
alias=Ornith-1.5-35B-A3B-Q8_0.gguf
kv-unified=true
spec-type=ngram-mod
spec-draft-n-max=3
draft-p-min=0
spec-ngram-mod-n-match=40
spec-ngram-mod-n-max=16

[gemma-4-31B-it]
n-gpu-layers=9999
dev=CUDA0
mmap=false
model=/var/models/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
model-draft=/var/models/gemma-4-31B-it-Q4_0-MTP.gguf
alias=gemma-4-31B-it
cache-type-k=q8_0
cache-type-v=q8_0
kv-unified=true
temperature=1.0
top-p=0.95
top-k=64
spec-type=draft-mtp,ngram-mod
spec-draft-n-max=4
spec-draft-type-k=q8_0
spec-draft-type-v=q8_0
spec-ngram-mod-n-match=40
spec-ngram-mod-n-max=16
c=90000

[zed-industries_zeta-2]
n-gpu-layers=9999
dev=CUDA0
mmap=false
model=/var/models/zed-industries_zeta-2-Q4_K_M.gguf
cache-type-k=q8_0
cache-type-v=q8_0
alias=zed-industries_zeta-2
parallel=1
spec-type=ngram-mod
spec-ngram-mod-n-match=40
spec-ngram-mod-n-max=16

[Deekseek4]
dev=CUDA0,VULKAN1
mmap=false
model=/var/models/DeepSeek-V4-Flash-UD-IQ3_XXS-00001-of-00004.gguf
model-draft=/var/models/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
alias=Deekseek4
