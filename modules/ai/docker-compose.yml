services:
    llama-cpp:
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan
        container_name: llama-cpp
        ports:
            - "8001:8001"
        volumes:
            - /var/models:/var/models:ro
            - ./model-files/desktop.ini:/var/models.ini:ro
            - /run/opengl-driver:/run/opengl-driver:ro
        environment:
            - LLAMA_ARG_HOST=0.0.0.0
            - LLAMA_ARG_PORT=8001
            - LLAMA_ARG_N_PARALLEL=1
            - LLAMA_ARG_MODELS_PRESET=/var/models.ini
            - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility
            - VK_ICD_FILENAMES=/run/opengl-driver/share/vulkan/icd.d/nvidia_icd.x86_64.json
            - LD_LIBRARY_PATH=/run/opengl-driver/lib
        devices:
            - /dev/dri:/dev/dri
            - /dev/kfd:/dev/kfd
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: cdi
                          capabilities: [gpu]
                          device_ids:
                              - nvidia.com/gpu=all
                              # Exposes the GPU renderer and card elements directly to the container
